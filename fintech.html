<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINTECH GOVERNANCE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=JetBrains+Mono&display=swap');
        body { background: #020617; color: #fff; font-family: 'JetBrains Mono', monospace; margin: 0; height: 100vh; display: flex; flex-direction: column; }
        header { padding: 20px; border-bottom: 2px solid #3b82f6; display: flex; justify-content: space-between; background: #000; }
        main { flex: 1; padding: 30px; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { background: rgba(30, 41, 59, 0.5); border: 1px solid #3b82f6; padding: 25px; border-radius: 15px; text-align: center; }
        .val { font-family: 'Orbitron'; font-size: 2rem; color: #fcc201; margin: 10px 0; }
    </style>
</head>
<body>
<header><div><b style="color:#3b82f6">FINTECH GOVERNANCE</b><br><small>ISO 20022 LIVE</small></div><a href="index.html" style="color:#fcc201; text-decoration:none">BACK</a></header>
<main>
    <div class="card"><div>TRANSACTION VELOCITY</div><div id="tps" class="val">1240 TPS</div></div>
    <div class="card"><div>LIQUIDITY RATIO</div><div id="liq" class="val">1.84</div></div>
</main>
<script>
    setInterval(() => {
        document.getElementById('tps').innerText = (1200 + Math.floor(Math.random()*200)) + " TPS";
        document.getElementById('liq').innerText = (1.80 + Math.random()*0.1).toFixed(2);
    }, 2000);
</script>
</body>
</html>
