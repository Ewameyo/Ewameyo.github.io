<script>
    // --- Live Clock ---
    function updateClock() {
        const now = new Date();
        document.getElementById('live-clock').innerText = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);

    // --- DTO-NEXUS: FINAL LIVE GLOBAL PULSE ---
    async function pulseFintech() {
        // Global Endpoints
        const cryptoUrl = 'https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&include_24hr_change=true&vs_currencies=usd';
        const fiatUrl = 'https://open.er-api.com/v6/latest/USD';

        try {
            // Parallel fetch for high-velocity sync
            const [cryptoRes, fiatRes] = await Promise.all([fetch(cryptoUrl), fetch(fiatUrl)]);
            const cryptoData = await cryptoRes.json();
            const fiatData = await fiatRes.json();

            // Data Extraction
            const btcPrice = cryptoData.bitcoin.usd;
            const btcChange = cryptoData.bitcoin.usd_24h_change;
            const kesRate = fiatData.rates.KES;

            // UI Injection: Global Standard Real-Time Data
            document.getElementById('tps-val').innerText = "$" + btcPrice.toLocaleString();
            document.getElementById('liq-val').innerText = kesRate.toFixed(2) + " KES";

            // LSSBB Logic: System Health Color Coding based on 24h Volatility
            const statusEl = document.getElementById('velocity-status');
            if (btcChange < 0) {
                statusEl.style.color = "#ff3333"; // Red for Volatility/Defect
                statusEl.innerText = "● VOLATILITY ALERT: " + btcChange.toFixed(2) + "%";
            } else {
                statusEl.style.color = "#39ff14"; // Green for Optimal Flow
                statusEl.innerText = "● SYSTEM NOMINAL: +" + btcChange.toFixed(2) + "%";
            }

            console.log(`DTO-NEXUS Sync: KES Rate @ ${kesRate} | BTC @ ${btcPrice}`);

        } catch (e) {
            console.warn("TELEMETRY BREACH: Reverting to Internal LSSBB Cache.");
            // Fallback to static numbers if internet fails to keep UI clean
            document.getElementById('tps-val').innerText = "OFFLINE";
        }
    }

    // Refresh Live Data every 30 seconds
    pulseFintech();
    setInterval(pulseFintech, 30000);

    // --- Neural Network Packet Animation ---
    const svg = document.getElementById('flow-svg');
    function createPacket() {
        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        const startY = Math.random() * 200;
        const endY = Math.random() * 200;
        
        circle.setAttribute("cx", "0%");
        circle.setAttribute("cy", startY);
        circle.setAttribute("r", "2");
        circle.setAttribute("fill", "#00d2ff");
        svg.appendChild(circle);

        let pos = 0;
        const interval = setInterval(() => {
            pos += 1;
            circle.setAttribute("cx", pos + "%");
            // Parabolic curve for "Neural Flow" effect
            circle.setAttribute("cy", startY + (endY - startY) * (pos/100));
            
            if (pos >= 100) {
                clearInterval(interval);
                if (svg.contains(circle)) svg.removeChild(circle);
            }
        }, 30);
    }
    // High-density packet flow (every 400ms)
    setInterval(createPacket, 400);
</script>
