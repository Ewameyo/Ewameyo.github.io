<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FINTECH GOVERNANCE | NEXUS 360</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=JetBrains+Mono:wght@400;700&display=swap');
        :root { --gold: #fcc201; --bg: #020617; --blue: #3b82f6; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: var(--bg); color: #fff; font-family: 'JetBrains Mono', monospace;
            height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column;
        }
        header {
            background: rgba(0,0,0,0.9); border-bottom: 2px solid var(--blue);
            padding: 20px; display: flex; justify-content: space-between; align-items: center;
        }
        main {
            flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px; padding: 25px; overflow-y: auto;
        }
        .fin-card {
            background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 15px; padding: 25px; transition: 0.4s;
        }
        .fin-card:hover { border-color: var(--gold); background: rgba(30, 41, 59, 0.8); transform: scale(1.02); }
        .stat-label { color: #94a3b8; font-size: 0.7rem; letter-spacing: 1px; }
        .stat-value { font-family: 'Orbitron'; font-size: 1.8rem; color: var(--gold); margin: 10px 0; }
        .iso-tag { background: var(--blue); color: #fff; font-size: 0.6rem; padding: 3px 8px; border-radius: 4px; display: inline-block; }
        footer { background: var(--blue); color: #fff; padding: 12px; text-align: center; font-family: 'Orbitron'; font-weight: 900; font-size: 0.7rem; }
    </style>
</head>
<body>

<header>
    <div>
        <h2 style="font-family: 'Orbitron'; font-size: 1.1rem; color: var(--blue);">FINTECH GOVERNANCE</h2>
        <p style="font-size: 0.6rem; color: #94a3b8;">ISO 20022 COMPLIANT LAYER</p>
    </div>
    <div style="font-family:'Orbitron'; font-size: 0.7rem; color: var(--gold);">LINK: SECURE</div>
</header>

<main>
    <div class="fin-card">
        <div class="stat-label">TRANSACTION VELOCITY</div>
        <div class="stat-value">1,240 TPS</div>
        <div class="iso-tag">REAL-TIME SYNC</div>
    </div>

    <div class="fin-card">
        <div class="stat-label">GOVERNANCE DRIFT</div>
        <div class="stat-value">0.004%</div>
        <div class="iso-tag">LSSBB OPTIMIZED</div>
    </div>

    <div class="fin-card">
        <div class="stat-label">LIQUIDITY RATIO</div>
        <div class="stat-value">1.84</div>
        <div class="iso-tag">STABLE</div>
    </div>

    <div class="fin-card">
        <div class="stat-label">ENCRYPTION PROTOCOL</div>
        <div class="stat-value">AES-256</div>
        <div class="iso-tag">ACTIVE</div>
    </div>
</main>

<footer>
    FINTECH NODE | ARCHITECTED BY EDGAR WAMEYO | BY GOD'S GRACE
</footer>

</body>
</html>
