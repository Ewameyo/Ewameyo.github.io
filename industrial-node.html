<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #020617; color: #fff; font-family: sans-serif; padding: 50px; text-align: center; }
        .bar-container { width: 300px; height: 30px; background: #1e293b; margin: 20px auto; border-radius: 15px; overflow: hidden; border: 1px solid #fcc201; }
        .bar-fill { height: 100%; background: #fcc201; width: 50%; transition: 0.8s ease-in-out; }
        h1 { font-family: 'Orbitron', sans-serif; color: #fcc201; }
    </style>
</head>
<body>
    <h1>ASSET LIVE LOAD</h1>
    <div class="bar-container"><div id="fill" class="bar-fill"></div></div>
    <h2 id="num">50%</h2>
    <a href="index.html" style="color:#fcc201">BACK TO HUB</a>
    <script>
        setInterval(() => {
            let val = 40 + Math.floor(Math.random() * 40);
            document.getElementById('fill').style.width = val + "%";
            document.getElementById('num').innerText = val + "%";
        }, 2000);
    </script>
</body>
</html>
