<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASSET NODE | EDGAR WAMEYO</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=JetBrains+Mono&display=swap');
        :root { --gold: #fcc201; --bg: #020617; }
        body { background: var(--bg); color: #fff; font-family: 'JetBrains Mono', monospace; margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        header { padding: 20px; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; }
        .card { width: 100%; max-width: 500px; background: rgba(30, 41, 59, 0.4); border: 1px solid var(--gold); border-radius: 20px; padding: 40px; text-align: center; }
        .val { font-family: 'Orbitron'; font-size: 4rem; color: var(--gold); margin: 20px 0; }
        .bar-container { display: flex; align-items: flex-end; justify-content: space-between; height: 120px; margin-top: 30px; }
        .bar { width: 18%; background: var(--gold); transition: height 0.5s ease; }
    </style>
</head>
<body>
    <header>
        <h2 style="font-family:'Orbitron'; color:var(--gold); margin:0;">ASSET GOVERNANCE</h2>
        <a href="index.html" style="color:var(--gold); text-decoration:none; border:1px solid var(--gold); padding:8px 15px; border-radius:5px;">HUB</a>
    </header>
    <main>
        <div class="card">
            <div style="letter-spacing:2px;">UTILIZATION LOAD</div>
            <div id="load-num" class="val">42%</div>
            <div class="bar-container">
                <div class="bar" style="height: 40%"></div>
                <div class="bar" style="height: 60%"></div>
                <div class="bar" style="height: 30%"></div>
                <div class="bar" style="height: 80%"></div>
                <div class="bar" style="height: 50%"></div>
            </div>
        </div>
    </main>
    <script>
        setInterval(() => {
            let lastVal = 0;
            document.querySelectorAll('.bar').forEach(bar => {
                let h = 20 + Math.floor(Math.random() * 75);
                bar.style.height = h + "%";
                lastVal = h;
            });
            document.getElementById('load-num').innerText = lastVal + "%";
        }, 2000);
    </script>
</body>
</html>
