<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SERVICE GOVERNANCE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=JetBrains+Mono&display=swap');
        body { background: #020617; color: #fff; font-family: 'JetBrains Mono', monospace; margin: 0; height: 100vh; display: flex; flex-direction: column; }
        header { padding: 20px; border-bottom: 2px solid #a855f7; display: flex; justify-content: space-between; background: #000; }
        main { flex: 1; padding: 30px; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { background: rgba(30, 41, 59, 0.5); border: 1px solid #a855f7; padding: 25px; border-radius: 15px; text-align: center; }
        .val { font-family: 'Orbitron'; font-size: 2rem; color: #fcc201; margin: 10px 0; }
    </style>
</head>
<body>
<header><div><b style="color:#a855f7">SERVICE GOVERNANCE</b><br><small>LSSBB OPTIMIZED</small></div><a href="index.html" style="color:#fcc201; text-decoration:none">BACK</a></header>
<main>
    <div class="card"><div>LIVE SLA</div><div id="sla" class="val">99.98%</div></div>
    <div class="card"><div>PROCESS SIGMA</div><div id="sig" class="val">5.82σ</div></div>
</main>
<script>
    setInterval(() => {
        document.getElementById('sla').innerText = (99.90 + Math.random()*0.09).toFixed(2) + "%";
        document.getElementById('sig').innerText = (5.80 + Math.random()*0.1).toFixed(2) + "σ";
    }, 3000);
</script>
</body>
</html>
