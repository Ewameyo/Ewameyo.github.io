<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SERVICES GOVERNANCE | NEXUS 360</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap');
        :root { --gold: #fcc201; --bg: #020617; --accent: #a855f7; --green: #22c55e; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: #fff; font-family: 'JetBrains Mono', monospace; height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; }
        header { background: rgba(0,0,0,0.9); border-bottom: 2px solid var(--accent); padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; }
        main { flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 30px; overflow-y: auto; }
        .svc-card { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(168, 85, 247, 0.3); border-radius: 16px; padding: 30px; }
        .svc-label { color: #d8b4fe; font-size: 0.75rem; text-transform: uppercase; }
        .svc-value { font-family: 'Orbitron'; font-size: 2.2rem; color: var(--gold); margin: 15px 0; }
        footer { background: var(--accent); color: #fff; padding: 15px; text-align: center; font-family: 'Orbitron'; font-weight: 900; font-size: 0.8rem; }
    </style>
</head>
<body>

<header>
    <div>
        <h2 style="font-family: 'Orbitron'; font-size: 1.2rem; color: var(--accent);">SERVICES GOVERNANCE</h2>
        <p style="font-size: 0.65rem; color: #d8b4fe;">360° OPERATIONAL HUB</p>
    </div>
    <a href="index.html" style="color:var(--gold); text-decoration:none; font-size:0.7rem; border:1px solid var(--gold); padding:5px 10px;">BACK</a>
</header>

<main>
    <div class="svc-card">
        <div class="svc-label">Live SLA Status</div>
        <div id="sla-val" class="svc-value">99.98%</div>
    </div>
    <div class="svc-card">
        <div class="svc-label">Process Efficiency</div>
        <div id="eff-val" class="svc-value">84%</div>
    </div>
    <div class="svc-card">
        <div class="svc-label">Variance (Sigma)</div>
        <div id="sig-val" class="svc-value">5.82σ</div>
    </div>
</main>

<footer>SERVICES GOVERNANCE | ENGINEERED BY EDGAR WAMEYO, LSSBB</footer>

<script>
    // LIVE SERVICES SIMULATOR
    function updateServices() {
        document.getElementById('sla-val').innerText = (99.90 + (Math.random() * 0.09)).toFixed(2) + "%";
        document.getElementById('eff-val').innerText = (80 + Math.floor(Math.random() * 10)) + "%";
        document.getElementById('sig-val').innerText = (5.80 + (Math.random() * 0.1)).toFixed(2) + "σ";
    }
    setInterval(updateServices, 3000);
</script>
</body>
</html>
