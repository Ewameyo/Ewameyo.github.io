<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="author" content="Edgar Wameyo">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS 360 | PRO TERMINAL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono&display=swap');
        :root { --gold: #fcc201; --bg: #020617; --card: #0f172a; --red: #ef4444; --green: #22c55e; }
        body { background: var(--bg); color: white; font-family: 'JetBrains Mono'; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #login-screen { text-align: center; background: var(--card); padding: 40px; border-radius: 20px; border: 1px solid var(--gold); width: 340px; }
        input { background: #000; border: 1px solid #334155; color: var(--gold); padding: 15px; font-size: 24px; text-align: center; width: 100%; margin-bottom: 20px; font-family: 'Orbitron'; outline: none; border-radius: 8px; }
        .btn { padding: 15px; width: 100%; border-radius: 10px; border: none; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; background: var(--gold); color: black; }
        .hidden { display: none !important; }
        #main-dashboard { width: 95%; max-width: 500px; background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid rgba(252,194,1,0.3); }
        .val { font-size: 24px; color: var(--gold); font-family: 'Orbitron'; }
        .log-box { background: #000; height: 100px; padding: 10px; font-size: 10px; color: var(--green); overflow-y: auto; margin-top: 20px; border-left: 2px solid var(--gold); }
    </style>
</head>
<body>
    <div id="login-screen">
        <h2 style="font-family:'Orbitron'; color:var(--gold); margin-bottom:20px;">MASTER KEY</h2>
        <input type="password" id="pinInput" maxlength="4" placeholder="****">
        <button class="btn" onclick="verifyAccess()">AUTHORIZE</button>
    </div>

    <div id="main-dashboard" class="hidden">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
            <div id="clock">00:00:00</div>
            <div style="color:var(--green)">SECURE NODE</div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:20px;">
            <div style="background:rgba(0,0,0,0.3); padding:15px; border-radius:10px;">
                <div style="font-size:9px; color:#64748b;">EFFICIENCY</div>
                <div class="val">98.9%</div>
            </div>
            <div style="background:rgba(0,0,0,0.3); padding:15px; border-radius:10px;">
                <div style="font-size:9px; color:#64748b;">LATENCY</div>
                <div class="val">8ms</div>
            </div>
        </div>
        <div class="log-box" id="log">> System Fully Secured...</div>
    </div>

    <script>
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
        async function verifyAccess() {
            const p = document.getElementById('pinInput').value;
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(p.trim()));
            const hash = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
            // Master hash check for Pro Terminal PIN
            if (hash === "f96f61689255018659f816c278c772e0a23363b9658253a69534725359b3626e") {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-dashboard').classList.remove('hidden');
            } else { alert("INVALID MASTER KEY"); }
        }
    </script>
</body>
</html>
