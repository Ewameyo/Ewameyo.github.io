<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="author" content="Edgar Wameyo">
    <meta name="copyright" content="Edgar Wameyo 2026">
    <meta name="version" content="DTO-Nexus-1.0-Proprietary">
    <title>NEXUS 360 | PRO TERMINAL</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        :root { --gold: #eab308; --bg: #020617; --card: #1e293b; --red: #ef4444; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        
        /* LOGIN SCREEN */
        #login-screen { text-align: center; background: var(--card); padding: 40px; border-radius: 20px; border: 1px solid var(--gold); box-shadow: 0 0 40px rgba(234,179,8,0.2); width: 320px; transition: all 0.5s; }
        input { background: #0f172a; border: 1px solid #334155; color: var(--gold); padding: 15px; font-size: 28px; text-align: center; border-radius: 8px; width: 80%; margin-bottom: 20px; letter-spacing: 8px; outline: none; }
        
        /* DASHBOARD */
        .hidden { display: none !important; }
        #main-dashboard { width: 95%; max-width: 450px; background: var(--card); padding: 25px; border-radius: 24px; text-align: center; border: 1px solid #334155; }
        
        /* STATUS UI */
        .dot { height: 12px; width: 12px; background: #ef4444; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .online-pulse { background: #22c55e !important; box-shadow: 0 0 10px #22c55e; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .top-row { display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; margin-bottom: 15px; font-family: monospace; }
        .btn { padding: 18px; border-radius: 12px; cursor: pointer; color: white; font-weight: bold; width: 100%; margin: 8px 0; border: none; font-size: 16px; text-transform: uppercase; transition: 0.2s; }
        .btn:active { transform: scale(0.98); }
        .log-box { background: #0f172a; border-radius: 10px; padding: 10px; margin-top: 20px; height: 80px; font-size: 11px; color: #64748b; overflow-y: auto; text-align: left; border-left: 3px solid var(--gold); font-family: 'JetBrains Mono', monospace; }
        
        .footer-shield { font-size: 9px; color: #475569; margin-top: 20px; text-transform: uppercase; letter-spacing: 1px; }
        .banned { filter: grayscale(1) brightness(0.4); pointer-events: none; border-color: var(--red) !important; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div style="font-size: 45px; margin-bottom: 10px;" id="shield-icon">🛡️</div>
        <h2 style="color: var(--gold); margin: 0; font-family: 'Orbitron', sans-serif;">NEXUS SECURE</h2>
        <div id="attempt-tracker" style="font-size: 10px; color: #64748b; margin-bottom: 10px;">AUTH LEVEL: REQUIRED</div>
        <input type="password" id="pinInput" maxlength="4" placeholder="••••">
        <button class="btn" style="background: var(--gold); color: black;" onclick="verifyAccess()">AUTHORIZE</button>
        <div class="footer-shield">Lead Systems Architect: Edgar Wameyo</div>
    </div>

    <div id="main-dashboard" class="hidden">
        <div class="top-row">
            <div id="digital-clock">00:00:00</div>
            <div><span class="dot" id="dot"></span><span id="stat-text">OFFLINE</span></div>
        </div>
        
        <div style="background: #0f172a; padding: 25px; border-radius: 18px; margin-bottom: 20px; border: 1px solid rgba(234,179,8,0.1);">
            <div style="font-size: 11px; color: #64748b;">LSSBB SYSTEM EFFICIENCY</div>
            <div style="font-size: 42px; font-weight: 900; color: var(--gold);">98.4%</div>
        </div>

        <button class="btn" style="background: #b91c1c;" onclick="publish('ARM')">ARM SYSTEM</button>
        <button class="btn" style="background: #15803d;" onclick="publish('DISARM')">DISARM HUB</button>
        
        <div class="log-box" id="event-log">> System initialized...<br>> Awaiting Authentication...</div>
        <div class="footer-shield" style="margin-top:15px;">Proprietary DTO Node | Federal Protection 2026</div>
    </div>

    <script>
        let attempts = 0;
        const MAX_ATTEMPTS = 3;
        let client;

        // Check for existing ban
        if(localStorage.getItem('banned') === 'true') {
            applyLockdown();
        }

        function updateClock() {
            document.getElementById('digital-clock').innerText = new Date().toLocaleTimeString();
        }
        setInterval(updateClock, 1000);

        async function verifyAccess() {
            const input = document.getElementById('pinInput').value;
            
            // Hash the input to check against your private key (7742)
            const encoder = new TextEncoder();
            const data = encoder.encode(input);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

            // Private Key: 7742
            if (hashHex === "6f0b4352b95b8637736f9477087612f00889270562e8477033734e565987309a") {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-dashboard').classList.remove('hidden');
                initiateConnection();
            } else {
                attempts++;
                document.getElementById('attempt-tracker').innerHTML = `<span style="color:var(--red)">WARNING: ATTEMPT ${attempts}/3</span>`;
                if (attempts >= MAX_ATTEMPTS) {
                    localStorage.setItem('banned', 'true');
                    applyLockdown();
                } else {
                    alert("ACCESS DENIED: PIN INCORRECT");
                }
            }
        }

        function applyLockdown() {
            const screen = document.getElementById('login-screen');
            screen.classList.add('banned');
            document.getElementById('shield-icon').innerText = "⚠️";
            document.getElementById('attempt-tracker').innerHTML = `<span style="color:var(--red)">PERMANENT LOCKDOWN ACTIVE</span>`;
            alert("SECURITY BREACH: IP LOGGED AND ACCESS REVOKED.");
        }

        function initiateConnection() {
            // Using your HiveMQ Cloud credentials
            client = new Paho.MQTT.Client("0d7ada916da04546a3a7b3482fd76615.s1.eu.hivemq.cloud", 8884, "Nexus_" + Math.random().toString(16).slice(2, 5));
            client.connect({
                useSSL: true, 
                userName: "admin", 
                password: "Nexus360!",
                onSuccess: () => {
                    document.getElementById('dot').classList.add('online-pulse');
                    document.getElementById('stat-text').innerText = "ONLINE";
                    addLog("Command Link Established.");
                },
                onFailure: (e) => { addLog("Connection Failed: " + e.errorMessage); }
            });
        }

        function addLog(msg) {
            const log = document.getElementById('event-log');
            log.innerHTML += `> ${msg}<br>`;
            log.scrollTop = log.scrollHeight;
        }

        function publish(val) {
            if(!client || !client.connected) {
                addLog("Error: Link Offline.");
                return;
            }
            const msg = new Paho.MQTT.Message(val);
            msg.destinationName = "nexus/control";
            client.send(msg);
            addLog(`Command: [${val}] Dispatched.`);
        }
    </script>
</body>
</html>
