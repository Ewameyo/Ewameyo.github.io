<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="author" content="Edgar Wameyo">
    <meta name="copyright" content="Edgar Wameyo 2026">
    <meta name="version" content="DTO-Nexus-1.0-Proprietary">
    <meta name="description" content="Proprietary Digital Twin Organization (DTO) Command Center by Edgar Wameyo. Lead Systems Architect specializing in LSSBB and 97% Operational Excellence.">
    <meta name="robots" content="index, follow">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS 360 | PRO TERMINAL</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        :root { --gold: #eab308; --bg: #020617; --card: #1e293b; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        
        /* PIN SCREEN */
        #login-screen { text-align: center; background: var(--card); padding: 40px; border-radius: 20px; border: 1px solid var(--gold); box-shadow: 0 0 40px rgba(234,179,8,0.2); width: 320px; }
        input { background: #0f172a; border: 1px solid #334155; color: var(--gold); padding: 15px; font-size: 28px; text-align: center; border-radius: 8px; width: 80%; margin-bottom: 20px; letter-spacing: 8px; outline: none; }
        
        /* DASHBOARD */
        .hidden { display: none !important; }
        #main-dashboard { width: 95%; max-width: 450px; background: var(--card); padding: 25px; border-radius: 24px; text-align: center; border: 1px solid #334155; }
        
        /* BLINKING EFFECT */
        .dot { height: 12px; width: 12px; background: #ef4444; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .online-pulse { 
            background: #22c55e !important; 
            box-shadow: 0 0 10px #22c55e;
            animation: blink 1.5s infinite; 
        }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* CLOCK & UI */
        .top-row { display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; margin-bottom: 15px; font-family: monospace; }
        .btn { padding: 18px; border-radius: 12px; cursor: pointer; color: white; font-weight: bold; width: 100%; margin: 8px 0; border: none; font-size: 16px; text-transform: uppercase; }
        .log-box { background: #0f172a; border-radius: 10px; padding: 10px; margin-top: 20px; height: 60px; font-size: 11px; color: #64748b; overflow-y: auto; text-align: left; border-left: 3px solid var(--gold); }
        
        /* PROPRIETARY FOOTER */
        .footer-shield { font-size: 9px; color: #475569; margin-top: 20px; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div style="font-size: 45px; margin-bottom: 10px;">🛡️</div>
        <h2 style="color: var(--gold); margin: 0;">NEXUS SECURE</h2>
        <input type="password" id="pinInput" maxlength="4" placeholder="••••">
        <button class="btn" style="background: var(--gold); color: black;" onclick="verifyAccess()">AUTHORIZE</button>
        <div class="footer-shield">IP of Edgar Wameyo © 2026</div>
    </div>

    <div id="main-dashboard" class="hidden">
        <div class="top-row">
            <div id="digital-clock">00:00:00</div>
            <div><span class="dot" id="dot"></span><span id="stat-text">OFFLINE</span></div>
        </div>
        
        <div style="background: #0f172a; padding: 25px; border-radius: 18px; margin-bottom: 20px;">
            <div style="font-size: 11px; color: #64748b;">SYSTEM EFFICIENCY</div>
            <div style="font-size: 42px; font-weight: 900; color: var(--gold);">98.4%</div>
        </div>

        <button class="btn" style="background: #b91c1c;" onclick="publish('ARM')">ARM SYSTEM</button>
        <button class="btn" style="background: #15803d;" onclick="publish('DISARM')">DISARM HUB</button>
        
        <div class="log-box" id="event-log"></div>
        <div class="footer-shield" style="margin-top:15px;">Proprietary DTO Node | Federal Protection Active</div>
    </div>

    <script>
        const SECRET_PIN = "1187";
        let client;

        function updateClock() {
            const now = new Date();
            document.getElementById('digital-clock').innerText = now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);

        function verifyAccess() {
            if (document.getElementById('pinInput').value === SECRET_PIN) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-dashboard').classList.remove('hidden');
                initiateConnection();
            } else {
                alert("ACCESS DENIED");
            }
        }

        function initiateConnection() {
            client = new Paho.MQTT.Client("0d7ada916da04546a3a7b3482fd76615.s1.eu.hivemq.cloud", 8884, "Nexus_" + Math.random().toString(16).slice(2, 5));
            client.connect({
                useSSL: true, userName: "admin", password: "Nexus360!",
                onSuccess: () => {
                    document.getElementById('dot').classList.add('online-pulse');
                    document.getElementById('stat-text').innerText = "ONLINE";
                    addLog("System Synced Successfully.");
                }
            });
        }

        function addLog(msg) {
            const log = document.getElementById('event-log');
            log.innerHTML += `> ${msg}<br>`;
            log.scrollTop = log.scrollHeight;
        }

        function publish(val) {
            if(!client || !client.connected) return;
            const msg = new Paho.MQTT.Message(val);
            msg.destinationName = "nexus/control";
            client.send(msg);
            addLog(`Command: ${val} sent.`);
        }
    </script>
</body>
</html>
