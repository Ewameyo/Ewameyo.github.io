<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDGAR WAMEYO | LEAD SYSTEMS ARCHITECT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@500;800&display=swap');
        :root { --gold: #fcc201; --bg: #020617; --green: #22c55e; }
        body { background: var(--bg); color: #fff; font-family: 'JetBrains Mono', monospace; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        #bg-canvas { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.15; }
        
        .terminal-frame { 
            width: 92%; max-width: 500px; background: rgba(15, 23, 42, 0.95); 
            border: 1px solid rgba(252, 194, 1, 0.3); border-radius: 16px; 
            padding: 30px 20px; margin-top: 40px; margin-bottom: 80px; 
            box-shadow: 0 0 50px rgba(0,0,0,0.8); backdrop-filter: blur(10px);
        }

        .header-status { 
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(0,0,0,0.5); padding: 15px; border-bottom: 2px solid var(--gold); 
            border-radius: 10px; margin-bottom: 25px; 
        }

        #clock { font-size: 1.6rem; font-weight: 800; text-shadow: 0 0 10px var(--gold); }
        .pulse { width: 12px; height: 12px; background: var(--green); border-radius: 50%; display: inline-block; margin-right: 10px; animation: blink 1s infinite; box-shadow: 0 0 15px var(--green); }

        .node { 
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); 
            padding: 18px; border-radius: 10px; text-decoration: none; color: white; 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 12px; transition: 0.3s; 
        }
        .node:hover { border-color: var(--gold); background: rgba(252, 194, 1, 0.08); transform: translateY(-2px); }

        .signature-footer { 
            position: fixed; bottom: 0; width: 100%; background: var(--gold); 
            color: #000; padding: 15px 0; text-align: center; 
            font-family: 'Orbitron'; font-weight: 900; font-size: 0.85rem; z-index: 1000; 
            box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="terminal-frame">
    <div class="header-status">
        <div style="font-family:'Orbitron'; font-size: 0.8rem; font-weight: 900; color: var(--green);">
            <span class="pulse"></span> SYSTEM: ACTIVE
        </div>
        <div id="clock">00:00:00</div>
    </div>

    <div style="text-align:center; margin-bottom: 25px;">
        <h1 style="font-family:'Orbitron'; font-size: 1.8rem; margin:0; letter-spacing: 2px;">EDGAR WAMEYO</h1>
        <div style="color:var(--gold); font-size: 0.75rem; font-weight:700; margin-top: 5px;">LEAD SYSTEMS ARCHITECT | LSSBB</div>
    </div>

    <div class="node-list">
        <a href="industrial-node.html" class="node">
            <div><b>ASSET NODE</b><br><span style="font-size:0.7rem; color:#64748b;">Predictive Analytics Hub</span></div>
            <span style="color:var(--gold)">▶</span>
        </a>
        <a href="fintech.html" class="node">
            <div><b>FINTECH NODE</b><br><span style="font-size:0.7rem; color:#64748b;">Velocity Governance</span></div>
            <span style="color:var(--gold)">▶</span>
        </a>
        <div class="node" onclick="unlock()" style="cursor:pointer;">
            <div><b>MANUFACTURING HUB</b><br><span style="font-size:0.7rem; color:#64748b;">Secured Hardware Node (v2.0)</span></div>
            <span id="lock-icon">🔒</span>
        </div>
    </div>
</div>

<div class="signature-footer">ENGINEERED BY EDGAR WAMEYO, LSSBB | BY GOD'S GRACE</div>

<script>
    // 1. CLOCK
    setInterval(() => { 
        document.getElementById('clock').innerText = new Date().toLocaleTimeString(); 
    }, 1000);

    // 2. NEW ROTATED SECURITY LOGIC (PIN 2285 IS DEPRECATED)
    function unlock() {
        let pin = prompt("NEW AUTHORIZATION REQUIRED. ENTER ROTATED PIN:");
        // This is the Base64 encoding for the NEW PIN '5591'
        let vault = "NTU5MQ=="; 
        
        if(btoa(pin) === vault) {
            alert("NEW ACCESS GRANTED. UPDATING HARDWARE SYNC...");
            document.getElementById('lock-icon').innerText = "🔓";
            window.location.href = "NexusPro.html";
        } else {
            alert("ACCESS DENIED. PREVIOUS CREDENTIALS EXPIRED.");
        }
    }

    // 3. AMBIENT BACKGROUND
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    
    function draw() {
        ctx.fillStyle = 'rgba(2, 6, 23, 0.1)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fcc201';
        for(let i=0; i<15; i++) { 
            ctx.fillText(Math.random() > 0.5 ? "1" : "0", Math.random()*canvas.width, Math.random()*canvas.height); 
        }
    }
    setInterval(draw, 50);

    window.onresize = () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    };
</script>
</body>
</html>
