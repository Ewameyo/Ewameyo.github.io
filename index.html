<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EDGAR WAMEYO | LEAD SYSTEMS ARCHITECT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@500;800&display=swap');
        
        :root { --gold: #fcc201; --bg: #020617; --green: #22c55e; }

        /* FIX: FULL SCREEN VIEWPORT */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #bg-canvas { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: -1; 
            display: block;
        }

        .terminal-frame { 
            width: 95%; 
            max-width: 600px; 
            background: rgba(15, 23, 42, 0.9); 
            border: 1px solid rgba(252, 194, 1, 0.4); 
            border-radius: 20px; 
            padding: 40px 30px; 
            box-shadow: 0 0 70px rgba(0,0,0,1);
            backdrop-filter: blur(15px);
            z-index: 10;
        }

        .header-status { 
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(0,0,0,0.6); padding: 20px; border-bottom: 2px solid var(--gold); 
            border-radius: 12px; margin-bottom: 30px; 
        }

        #clock { font-size: 1.8rem; font-weight: 800; color: #fff; text-shadow: 0 0 15px var(--gold); }
        .pulse { width: 14px; height: 14px; background: var(--green); border-radius: 50%; display: inline-block; margin-right: 12px; animation: blink 1.2s infinite; box-shadow: 0 0 20px var(--green); }

        .node { 
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); 
            padding: 22px; border-radius: 12px; text-decoration: none; color: white; 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 15px; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        
        .node:hover { border-color: var(--gold); background: rgba(252, 194, 1, 0.1); transform: scale(1.03); }

        .signature-footer { 
            position: fixed; bottom: 0; width: 100%; background: var(--gold); 
            color: #000; padding: 18px 0; text-align: center; 
            font-family: 'Orbitron'; font-weight: 900; font-size: 0.9rem; z-index: 1000; 
            letter-spacing: 1px;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="terminal-frame">
    <div class="header-status">
        <div style="font-family:'Orbitron'; font-size: 0.9rem; font-weight: 900; color: var(--green);">
            <span class="pulse"></span> SYSTEM: ACTIVE
        </div>
        <div id="clock">00:00:00</div>
    </div>

    <div style="text-align:center; margin-bottom: 30px;">
        <h1 style="font-family:'Orbitron'; font-size: 2.2rem; margin:0; letter-spacing: 3px;">EDGAR WAMEYO</h1>
        <div style="color:var(--gold); font-size: 0.85rem; font-weight:700; margin-top: 8px;">LEAD SYSTEMS ARCHITECT | LSSBB</div>
    </div>

    <div class="node-list">
        <a href="services-node.html" class="node">
            <div><b>SERVICE NODE</b><br><span style="font-size:0.75rem; color:#94a3b8;">360° Operational Governance</span></div>
            <span style="color:var(--gold)">▶</span>
        </a>
        <a href="fintech.html" class="node">
            <div><b>FINTECH NODE</b><br><span style="font-size:0.75rem; color:#94a3b8;">Velocity & Liquidity Hub</span></div>
            <span style="color:var(--gold)">▶</span>
        </a>
        <div class="node" onclick="unlock()" style="cursor:pointer;">
            <div><b>MANUFACTURING HUB</b><br><span style="font-size:0.75rem; color:#94a3b8;">Secured Hardware Node (v2.0)</span></div>
            <span id="lock-icon">🔒</span>
        </div>
    </div>
</div>

<div class="signature-footer">ENGINEERED BY EDGAR WAMEYO, LSSBB | BY GOD'S GRACE</div>

<script>
    // 1. CLOCK LOGIC
    setInterval(() => { 
        document.getElementById('clock').innerText = new Date().toLocaleTimeString(); 
    }, 1000);

    // 2. SECURITY ROTATION (PIN: 5591)
    function unlock() {
        let pin = prompt("NEW AUTHORIZATION REQUIRED. ENTER ROTATED PIN:");
        let vault = "NTU5MQ=="; 
        if(btoa(pin) === vault) {
            alert("NEW ACCESS GRANTED. UPDATING HARDWARE SYNC...");
            document.getElementById('lock-icon').innerText = "🔓";
            window.location.href = "NexusPro.html";
        } else {
            alert("ACCESS DENIED. CREDENTIALS EXPIRED.");
        }
    }

    // 3. RESTORED & FIXED: FULL SCREEN MATRIX EFFECT
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const characters = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function drawMatrix() {
        ctx.fillStyle = "rgba(2, 6, 23, 0.1)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = "#fcc201"; 
        ctx.font = fontSize + "px monospace";

        for (let i = 0; i < drops.length; i++) {
            const text = characters.charAt(Math.floor(Math.random() * characters.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);

            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                drops[i] = 0;
            }
            drops[i]++;
        }
    }
    setInterval(drawMatrix, 50);
</script>
</body>
</html>
