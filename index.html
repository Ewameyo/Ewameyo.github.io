<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edgar Wameyo | MBB Executive Command</title>
    <link href="https://fonts.googleapis.com/css?family=Bebas+Neue|Rajdhani:wght@300;500;700|Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #05080f; --surface: #0c121d; --panel: #111927; --border: #1e2d47;
            --gold: #f0b429; --cyan: #00d4ff; --green: #00ff9d; --red: #ff4757;
            --text: #e2e8f0; --font-main: 'Rajdhani', sans-serif; --font-mono: 'Share Tech Mono', monospace;
        }
        * { box-sizing: border-box; }
        html, body { 
            background: var(--ink); color: var(--text); font-family: var(--font-main); 
            margin: 0; padding: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column;
        }

        /* 1. TOP TICKER - RESTORED POWER */
        .ticker-wrap { background: #000; border-bottom: 1px solid var(--border); padding: 8px 0; overflow: hidden; white-space: nowrap; flex-shrink: 0; }
        .ticker { 
            display: inline-block; padding-left: 100%; animation: ticker 40s linear infinite; 
            font-family: var(--font-mono); font-size: 12px; color: var(--cyan); text-transform: uppercase; letter-spacing: 2px;
        }
        @keyframes ticker { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

        /* 2. NAVIGATION */
        .nav-menu { background: #000; border-bottom: 1px solid var(--border); padding: 0 30px; display: flex; gap: 20px; height: 45px; align-items: center; flex-shrink: 0; }
        .nav-item { font-family: var(--font-mono); font-size: 11px; color: #64748b; text-decoration: none; text-transform: uppercase; padding: 5px 10px; border: 1px solid transparent; }
        .nav-item.active { color: var(--gold); border: 1px solid var(--gold); background: rgba(240, 180, 41, 0.1); }

        /* 3. IDENTITY BAR */
        .identity-bar { background: var(--surface); border-bottom: 2px solid var(--gold); padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .name-brand { font-family: 'Bebas Neue'; font-size: 38px; letter-spacing: 2px; color: #fff; }
        .name-brand span { color: var(--gold); }
        .live-status { font-family: var(--font-mono); font-size: 13px; color: var(--green); display: flex; align-items: center; gap: 10px; }
        .pulse { width: 10px; height: 10px; background: var(--green); border-radius: 50%; box-shadow: 0 0 10px var(--green); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* 4. KPI DENSITY */
        .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 20px 30px; flex-shrink: 0; }
        .kpi-card { background: var(--panel); border: 1px solid var(--border); padding: 20px; border-top: 3px solid var(--cyan); }
        .kpi-label { font-family: var(--font-mono); font-size: 11px; color: var(--gold); text-transform: uppercase; }
        .kpi-val { font-size: 34px; font-weight: 700; color: #fff; margin-top: 5px; }

        /* 5. DYNAMIC MAIN GRID */
        .main-grid { display: grid; grid-template-columns: 1.2fr 1fr 0.8fr; gap: 20px; padding: 0 30px 20px; flex-grow: 1; overflow: hidden; }
        .panel { background: var(--panel); border: 1px solid var(--border); padding: 20px; border-radius: 4px; display: flex; flex-direction: column; min-height: 0; }
        .panel-h { color: var(--gold); font-family: 'Bebas Neue'; font-size: 22px; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 15px; flex-shrink: 0; }
        
        /* SCROLLABLE CONTENT AREA */
        .panel-content { flex-grow: 1; overflow-y: auto; padding-right: 5px; }
        .panel-content::-webkit-scrollbar { width: 4px; }
        .panel-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        /* PROJECT CARDS */
        .project-detail { background: rgba(255,255,255,0.03); padding: 12px; border-left: 3px solid var(--green); margin-bottom: 12px; }
        .p-title { color: var(--cyan); font-weight: 700; font-size: 15px; margin-bottom: 4px; }
        .p-desc { font-size: 12.5px; color: #cbd5e1; line-height: 1.4; }

        /* DMAIC BOXES */
        .dmaic-step { display: flex; gap: 15px; background: rgba(0,212,255,0.05); padding: 10px; margin-bottom: 8px; border-radius: 4px; border: 1px solid var(--border); }
        .step-tag { font-family: 'Bebas Neue'; font-size: 20px; color: var(--cyan); min-width: 20px; }
        .step-info b { font-size: 13px; color: #fff; text-transform: uppercase; display: block; }
        .step-info p { margin: 2px 0 0; font-size: 12px; color: #94a3b8; }

        /* TABLE SCALING */
        table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 13px; }
        td { padding: 12px 0; border-bottom: 1px solid var(--border); }
        .val-up { color: var(--green); font-weight: bold; }

        .exec-sum { margin-top: auto; padding: 12px; background: rgba(240,180,41,0.1); border: 1px solid var(--gold); border-radius: 4px; font-size: 12px; line-height: 1.4; }
    </style>
</head>
