<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDGAR WAMEYO | COMMAND CENTER</title>
  <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@500&display=swap');
      :root { --gold: #fcc201; --bg: #020617; --green: #22c55e; --red: #ef4444; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg); display: flex; justify-content: center; align-items: center; font-family: 'Orbitron', sans-serif; }
      #bg-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; }
      
      .terminal-frame { 
          width: 95%; max-width: 450px; background: rgba(15, 23, 42, 0.95); 
          border: 2px solid var(--gold); border-radius: 20px; padding: 30px; 
          box-shadow: 0 0 50px rgba(0,0,0,0.8); z-index: 10; text-align: center;
      }

      .node { 
          background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); 
          padding: 15px; border-radius: 12px; margin: 10px 0; color: white;
          display: flex; justify-content: space-between; cursor: pointer; transition: 0.3s;
      }
      .node:hover { border-color: var(--gold); background: rgba(252, 194, 1, 0.1); }

      #auth-zone { display: none; margin-top: 15px; }
      input { 
          background: #000; border: 1px solid var(--gold); color: var(--gold); 
          padding: 10px; width: 100%; text-align: center; font-family: 'JetBrains Mono';
          border-radius: 5px; outline: none;
      }
      .error-msg { color: var(--red); font-size: 0.7rem; margin-top: 10px; display: none; }
  </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="terminal-frame">
  <h1 style="color:white; margin-bottom: 5px;">EDGAR WAMEYO</h1>
  <p style="color:var(--gold); font-size: 0.8rem; margin-bottom: 20px;">SYSTEM ARCHITECT | LSSBB</p>

  <div class="node" onclick="alert('Node Active')"><span>ASSET NODE</span><span>▶</span></div>
  <div class="node" onclick="alert('Node Active')"><span>FINTECH NODE</span><span>▶</span></div>
  
  <div class="node" onclick="showAuth()">
      <span>MANUFACTURING HUB</span><span id="lock-status">🔒</span>
  </div>

  <div id="auth-zone">
      <input type="password" id="pin-input" placeholder="ENTER KEY" maxlength="4" oninput="checkPin(this.value)">
      <div id="error" class="error-msg">INVALID ARCHITECT KEY</div>
  </div>
</div>

<script>
  // Show the input field when hub is clicked
  function showAuth() {
      document.getElementById('auth-zone').style.display = 'block';
      document.getElementById('pin-input').focus();
  }

  // Automatic check as you type
  function checkPin(val) {
      if (val === "1187") {
          document.getElementById('lock-status').innerText = "🔓";
          document.getElementById('pin-input').style.borderColor = "var(--green)";
          setTimeout(() => {
              window.location.href = "NexusPro.html";
          }, 500);
      } else if (val.length === 4) {
          document.getElementById('error').style.display = 'block';
          setTimeout(() => { 
              document.getElementById('pin-input').value = "";
              document.getElementById('error').style.display = 'none';
          }, 1000);
      }
  }

  // Background Matrix Effect
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const drops = Array(Math.floor(canvas.width / 14)).fill(1);
  function draw() {
      ctx.fillStyle = "rgba(2, 6, 23, 0.1)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#fcc201";
      drops.forEach((y, i) => {
          ctx.fillText(Math.floor(Math.random() * 2), i * 14, y * 14);
          if (y * 14 > canvas.height && Math.random() > 0.975) drops[i] = 0;
          drops[i]++;
      });
  }
  setInterval(draw, 50);
</script>

</body>
</html>
