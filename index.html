<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaizen Exponential Ecosystem - MBB 360°</title>
    <link href="https://fonts.googleapis.com/css?family=Bebas+Neue&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #0a0e17; --surface: #0f1623; --panel: #141c2e; --border: #1e2d47;
            --gold: #f0b429; --gold2: #ffd166; --cyan: #00d4ff; --green: #00ff9d;
            --red: #ff4757; --purple: #9f7aea; --text: #c8d8f0; --muted: #5a7090;
            --font-display: 'Bebas Neue', sans-serif; --font-body: 'Rajdhani', sans-serif; --font-mono: 'Share Tech Mono', monospace;
        }
        body { background: var(--ink); color: var(--text); font-family: var(--font-body); margin: 0; padding: 0; line-height: 1.5; }
        
        /* SYNC BAR */
        #sync-status-bar { text-align: center; background: #1a1a1a; padding: 10px; border-bottom: 2px solid var(--gold); font-family: var(--font-mono); font-size: 13px; }
        
        /* HEADER */
        header { position: sticky; top: 0; z-index: 100; background: rgba(10,14,23,0.96); border-bottom: 1px solid var(--border); backdrop-filter: blur(16px); display: flex; align-items: center; justify-content: space-between; padding: 0 28px; height: 58px; }
        .logo { font-family: var(--font-display); font-size: 22px; letter-spacing: 3px; color: var(--gold); text-transform: uppercase; }
        .logo span { color: var(--cyan); }
        .header-badges { display: flex; gap: 10px; align-items: center; }
        .badge { font-family: var(--font-mono); font-size: 10px; padding: 3px 10px; border-radius: 2px; text-transform: uppercase; border: 1px solid var(--border); }
        
        /* GRID & PANELS */
        .main-grid { display: grid; grid-template-columns: 340px 1fr 300px; gap: 16px; padding: 20px 28px; }
        .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
        .panel-header { padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--gold); font-family: var(--font-display); letter-spacing: 2px; }
        .panel-body { padding: 16px; }

        /* KPI TILES */
        .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 20px 28px; }
        .kpi-tile { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 16px; position: relative; }
        .kpi-label { font-family: var(--font-mono); font-size: 10px; color: var(--muted); text-transform: uppercase; }
        .kpi-value { font-family: var(--font-display); font-size: 38px; color: var(--cyan); }

        /* KAIZEN CARDS */
        .kaizen-card { background: var(--ink); border: 1px solid var(--border); border-radius: 4px; padding: 12px; margin-bottom: 8px; }
        .kaizen-id { font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
        .kaizen-title { font-weight: 600; font-size: 14px; color: #fff; margin-top: 4px; }

        /* SIGMA GAUGE */
        .sigma-container { text-align: center; padding: 20px; }
        .progress-ring_circle { transition: stroke-dashoffset 0.5s ease; transform: rotate(-90deg); transform-origin: 50% 50%; stroke: var(--green); }
        
        @media (max-width: 1100px) { .main-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div id="sync-status-bar">
        <span style="color: var(--green);">● LIVE SYSTEM</span>
        <span style="margin-left: 15px;">LAST SYNC: </span>
        <span id="lastUpdated" style="color: var(--gold);">INITIALIZING...</span>
    </div>

    <header>
        <div class="logo">MBB COMMAND <span>360°</span></div>
        <div class="header-badges">
            <span class="badge" style="color: var(--gold); border-color: var(--gold);">MBB LEVEL</span>
            <span class="badge" style="color: var(--cyan); border-color: var(--cyan);">LSS STRATEGY</span>
        </div>
    </header>

    <div class="kpi-row">
        <div class="kpi-tile"><div class="kpi-label">Sigma Level</div><div class="kpi-value" id="kpiSigma">4.8σ</div></div>
        <div class="kpi-tile"><div class="kpi-label">Savings YTD</div><div class="kpi-value" id="kpiSavings">$2.1M</div></div>
        <div class="kpi-tile"><div class="kpi-label">Active Kaizens</div><div class="kpi-value" id="kpiKaizens">12</div></div>
        <div class="kpi-tile"><div class="kpi-label">Engagement</div><div class="kpi-value" id="kpiEng">87%</div></div>
    </div>

    <div class="main-grid">
        <div class="panel">
            <div class="panel-header">DMAIC Navigator</div>
            <div class="panel-body" id="dmaicNav">
                <p style="font-size: 13px; color: var(--muted);">Establishing CTQ Trees and Project Charters...</p>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">Live Kaizen Board</div>
            <div class="panel-body" id="kaizenBoard">
                </div>
        </div>

        <div class="panel">
            <div class="panel-header">Sigma Quality Level</div>
            <div class="panel-body">
                <div class="sigma-container">
                    <svg width="120" height="120">
                        <circle stroke="rgba(255,255,255,0.1)" stroke-width="8" fill="transparent" r="52" cx="60" cy="60"/>
                        <circle id="sigmaCircle" stroke-width="8" stroke-dasharray="326.7" stroke-dashoffset="326.7" fill="transparent" r="52" cx="60" cy="60" class="progress-ring_circle"/>
                    </svg>
                    <div style="font-size: 2.5rem; font-weight: bold; margin-top: -10px;"><span id="sigmaValue">0.0</span>σ</div>
                </div>
            </div>
        </div>
    </div>

<script>
const kaizenData = [
    { id: 'KZ-2024-001', title: 'OEE Optimization - Line A' },
    { id: 'KZ-2024-002', title: 'Inventory Waste Reduction' },
    { id: 'KZ-2024-003', title: 'SMED Changeover Improvement' }
];

function updateDashboard() {
    // Update Clock
    const now = new Date();
    document.getElementById('lastUpdated').innerText = now.toLocaleTimeString();

    // Render Kaizens
    const board = document.getElementById('kaizenBoard');
    board.innerHTML = kaizenData.map(k => `
        <div class="kaizen-card">
            <div class="kaizen-id">${k.id}</div>
            <div class="kaizen-title">${k.title}</div>
        </div>
    `).join('');

    // Update Sigma Gauge
    const sigma = 4.8;
    const circum = 52 * 2 * Math.PI;
    document.getElementById('sigmaCircle').style.strokeDashoffset = circum - (sigma / 6.0) * circum;
    document.getElementById('sigmaValue').innerText = sigma.toFixed(1);
}

window.onload = () => {
    updateDashboard();
    setInterval(updateDashboard, 1000);
};
</script>
</body>
</html>
