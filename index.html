<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus 360 | Industrial Command Center</title>
    <style>
        :root {
            --primary: #1e293b; --gold: #eab308; --danger: #ef4444; --success: #22c55e;
        }
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        
        /* Executive Insight Box */
        .insight-card {
            background: rgba(30, 41, 59, 0.8); border: 2px solid var(--gold);
            padding: 20px; border-radius: 12px; margin-bottom: 20px;
        }
        .executive-status { font-size: 1.5rem; font-weight: bold; margin-bottom: 5px; }
        .action-text { font-size: 1rem; color: #cbd5e1; }

        /* Main Dashboard Elements */
        .header { margin-bottom: 30px; }
        .logo-placeholder { height: 60px; margin-bottom: 10px; border: 1px dashed var(--gold); line-height: 60px; }
        .clock { font-size: 2rem; color: var(--gold); margin: 10px 0; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 500px; margin: auto; }
        .stat-box { background: #1e293b; padding: 15px; border-radius: 8px; border-bottom: 3px solid var(--gold); }
        
        .btn { 
            background: var(--gold); color: black; border: none; padding: 15px 40px; 
            font-size: 1.2rem; font-weight: bold; border-radius: 50px; cursor: pointer; margin-top: 30px;
        }
        .blink { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-placeholder">[ MANUFACTURING CO. LOGO HERE ]</div>
        <h1>NEXUS 360 COMMAND</h1>
        <div id="clock" class="clock">00:00:00</div>
    </div>

    <div class="insight-card">
        <div id="executive-status" class="executive-status">ANALYZING LINE...</div>
        <div id="action-text" class="action-text">Please wait for secure data sync.</div>
    </div>

    <div class="grid">
        <div class="stat-box">
            <small>EFFICIENCY (OEE)</small>
            <div id="oee-val" style="font-size: 1.8rem; color: var(--success);">94.2%</div>
        </div>
        <div class="stat-box">
            <small>Cpk (CAPABILITY)</small>
            <div id="cpk-val" style="font-size: 1.8rem;">1.42</div>
        </div>
    </div>

    <button class="btn" onclick="triggerCommand()">ENTER PIN 1187</button>

    <script>
        // Update Clock
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }, 1000);

        // THE ARCHITECT'S LOGIC (Runs every 5 seconds)
        function updatePlatform() {
            // Simulated Data from Factory Line
            let currentCpk = (Math.random() * (1.8 - 1.1) + 1.1).toFixed(2);
            document.getElementById('cpk-val').innerText = currentCpk;

            const status = document.getElementById('executive-status');
            const action = document.getElementById('action-text');

            // EXECUTIVE INSIGHT LOGIC
            if (currentCpk >= 1.67) {
                status.innerText = "💎 PROCESS ELITE";
                status.style.color = "#22c55e";
                action.innerText = "Status: Maximum Profitability. No intervention required.";
            } else if (currentCpk >= 1.33) {
                status.innerText = "✅ PROCESS STABLE";
                status.style.color = "#eab308";
                action.innerText = "Status: Monitoring minor variance. System within limits.";
            } else {
                status.innerText = "🚨 PREDICTIVE ALERT: RISK";
                status.style.color = "#ef4444";
                status.classList.add('blink');
                action.innerText = "URGENT: Capability Erosion. Potential financial leak in Line 4.";
            }
        }

        function triggerCommand() {
            let pin = prompt("Enter Secure Command PIN:");
            if (pin === "1187") {
                alert("SYSTEM ARMED: Control Signal Sent to ESP32.");
            } else {
                alert("ACCESS DENIED: Unauthorized Attempt Logged.");
            }
        }

        setInterval(updatePlatform, 5000);
    </script>
</body>
</html>
