<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="author" content="Edgar Wameyo">
  <meta name="copyright" content="Edgar Wameyo 2026">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EDGAR WAMEYO | COMMAND CENTER</title>
  <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@500;800&display=swap');
      :root { --gold: #fcc201; --bg: #020617; --green: #22c55e; --red: #ef4444; --silver: #e2e8f0; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg); display: flex; justify-content: center; align-items: center; }
      #bg-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; }
      .ticker-wrap { position: fixed; top: 0; width: 100%; background: rgba(0,0,0,0.9); border-bottom: 1px solid var(--gold); overflow: hidden; z-index: 100; }
      .ticker { display: inline-block; white-space: nowrap; animation: ticker 30s linear infinite; color: var(--gold); font-size: 0.8rem; padding: 12px 0; font-family: 'JetBrains Mono'; }
      @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
      .terminal-frame { width: 95%; max-width: 500px; background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(252, 194, 1, 0.4); border-radius: 20px; padding: 25px; box-shadow: 0 0 80px rgba(0,0,0,1); backdrop-filter: blur(15px); z-index: 10; display: flex; flex-direction: column; }
      #clock { font-size: 1.4rem; font-weight: 800; color: #fff; text-shadow: 0 0 15px var(--gold); font-family: 'Orbitron'; }
      .node { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px 18px; border-radius: 12px; text-decoration: none; color: white; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; transition: 0.3s ease; font-family: 'Orbitron'; cursor: pointer; }
      .node:hover { border-color: var(--gold); background: rgba(252, 194, 1, 0.1); transform: translateX(5px); }
      #security-flow-monitor { background: rgba(0,0,0,0.4); border: 1px solid var(--red); border-radius: 12px; padding: 12px; margin-top: 10px; font-family: 'JetBrains Mono'; }
      .log-area { font-size: 0.55rem; color: var(--green); margin-top: 8px; height: 35px; overflow: hidden; }
      .signature-footer { position: fixed; bottom: 0; width: 100%; background: #ff0000; color: #fff; padding: 10px 0; text-align: center; font-family: 'Orbitron'; font-weight: 900; font-size: 0.7rem; z-index: 1000; border-top: 2px solid #fff; }
  </style>
</head>
<body>

<div class="ticker-wrap">
  <div class="ticker">GLOBAL GOVERNANCE ACTIVE | ARCHITECT: EDGAR WAMEYO | DTO NEXUS v1.0 | LSSBB CERTIFIED</div>
</div>

<canvas id="bg-canvas"></canvas>

<div class="terminal-frame">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <div style="font-family:'Orbitron'; font-size: 0.7rem; color: var(--green);">● SYSTEM: ACTIVE</div>
      <div id="clock">00:00:00</div>
  </div>

  <div style="text-align:center; margin-bottom: 20px;">
      <h1 style="font-family:'Orbitron'; color:white;">EDGAR WAMEYO</h1>
      <div style="color:var(--gold); font-size: 0.7rem; font-family:'Orbitron';">LEAD SYSTEMS ARCHITECT</div>
  </div>

  <div class="node-list">
      <div class="node"><div><b>ASSET NODE</b></div><span style="color:var(--gold)">▶</span></div>
      <div class="node" onclick="gateOne()">
          <div><b>MANUFACTURING HUB</b></div><span id="lock-icon">🔒</span>
      </div>
  </div>

  <div id="security-flow-monitor">
       <div style="color:var(--red); font-size: 0.6rem;">SECURITY FLOW MONITOR</div>
       <div id="security-log" class="log-area">> Initializing Shields...<br>> System Secured.</div>
  </div>
</div>

<div class="signature-footer">CONFIDENTIAL | © 2026 EDGAR WAMEYO</div>

<script>
  function updateClock() { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }
  setInterval(updateClock, 1000); updateClock();

  // SECURE ENCRYPTION LOGIC
  async function hash(string) {
      const utf8 = new TextEncoder().encode(string);
      const hashBuffer = await crypto.subtle.digest('SHA-256', utf8);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }

  // GATE 1: MANUFACTURING HUB (PIN: 7742)
  async function gateOne() {
      let p = prompt("ENTER HUB KEY:");
      if (!p) return;
      const h = await hash(p);
      // SHA-256 for 7742
      if(h === "6f0b4352b95b8637736f9477087612f00889270562e8477033734e565987309a") {
          document.getElementById('security-log').innerHTML = "> HUB AUTHORIZED...<br>" + document.getElementById('security-log').innerHTML;
          gateTwo(); // Proceed to Internal Gate
      } else {
          alert("ACCESS DENIED");
      }
  }

  // GATE 2: NEXUS PRO (PIN: 1187)
  async function gateTwo() {
      let p = prompt("ENTER ARCHITECT MASTER KEY:");
      if (!p) return;
      const h = await hash(p);
      // SHA-256 for 1187
      if(h === "6464522956c38622998a1a9e993309a60e0a3598585931338870312689539268") {
          window.location.href = "NexusPro.html";
      } else {
          alert("INTERNAL ACCESS DENIED");
      }
  }

  // Background Matrix Rain
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const drops = Array(Math.floor(canvas.width / 14)).fill(1);
  function draw() {
      ctx.fillStyle = "rgba(2, 6, 23, 0.15)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#fcc201"; ctx.font = "14px monospace";
      drops.forEach((y, i) => {
          ctx.fillText(Math.floor(Math.random() * 2), i * 14, y * 14);
          if (y * 14 > canvas.height && Math.random() > 0.975) drops[i] = 0;
          drops[i]++;
      });
  }
  setInterval(draw, 50);
</script>
</body>
</html>
