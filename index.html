<script>
   let attempts = 0;
   const MAX_ATTEMPTS = 3;

   // 1. Clear Ban visually if it exists
   if(localStorage.getItem('banned') === 'true') { applyBan(); }

   function updateClock() { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }
   setInterval(updateClock, 1000);

   // 2. Architect Reset (Click Name 5 Times)
   let resetCount = 0;
   function architectReset() {
       resetCount++;
       if(resetCount >= 5) {
           localStorage.removeItem('banned');
           alert("ARCHITECT OVERRIDE: ACCESS RESTORED");
           location.reload();
       }
   }

   // 3. BULLETPROOF UNLOCK
   function unlock() {
       // Force prompt to ignore any previous ban state for the Architect
       let p = prompt("ENTER HUB ACCESS KEY:");
       
       if (!p) return;

       // Clean the input (remove spaces)
       let cleanedInput = p.trim();

       if(cleanedInput === "7742") {
           // SUCCESS
           localStorage.removeItem('banned'); 
           document.getElementById('lock-icon').innerHTML = "🔓";
           document.getElementById('lock-icon').style.color = "var(--green)";
           
           setTimeout(() => {
               window.location.href = "NexusPro.html";
           }, 500);
       } else {
           // FAIL
           attempts++;
           const log = document.getElementById('security-log');
           log.innerHTML = `<span style="color:var(--red)">> ERROR: INVALID KEY (${attempts}/${MAX_ATTEMPTS})</span><br>` + log.innerHTML;
           
           if(attempts >= MAX_ATTEMPTS) {
               localStorage.setItem('banned', 'true');
               applyBan();
           } else {
               alert("INVALID ACCESS KEY. ACCESS DENIED.");
           }
       }
   }

   function applyBan() {
       document.getElementById('main-frame').classList.add('banned');
       document.getElementById('status-text').innerText = "LOCKED";
       document.getElementById('status-pulse').style.background = "var(--red)";
       document.getElementById('threat-level').innerText = "LEVEL: CRITICAL";
   }

   // Canvas Matrix logic...
   const canvas = document.getElementById('bg-canvas');
   const ctx = canvas.getContext('2d');
   function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
   window.addEventListener('resize', resize); resize();
   const characters = "01"; const fontSize = 14; const columns = canvas.width / fontSize;
   const drops = Array(Math.floor(columns)).fill(1);
   function draw() {
       ctx.fillStyle = "rgba(2, 6, 23, 0.15)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
       ctx.fillStyle = localStorage.getItem('banned') === 'true' ? "#ff0000" : "#fcc201";
       ctx.font = fontSize + "px monospace";
       for (let i = 0; i < drops.length; i++) {
           const text = characters.charAt(Math.floor(Math.random() * characters.length));
           ctx.fillText(text, i * fontSize, drops[i] * fontSize);
           if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
           drops[i]++;
       }
   }
   setInterval(draw, 50);
</script>
