<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EDGAR WAMEYO | COMMAND CENTER</title>
  <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono&display=swap');
      :root { --gold: #fcc201; --bg: #020617; --green: #22c55e; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: var(--bg); color: white; font-family: 'Orbitron'; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
      #bg-canvas { position: fixed; top: 0; left: 0; z-index: -1; }
      .terminal-frame { width: 95%; max-width: 500px; background: rgba(15, 23, 42, 0.95); border: 1px solid var(--gold); border-radius: 20px; padding: 25px; box-shadow: 0 0 50px #000; }
      .node { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 12px; margin-bottom: 10px; cursor: pointer; transition: 0.3s; display: flex; justify-content: space-between; text-decoration: none; color: white; }
      .node:hover { border-color: var(--gold); background: rgba(252, 194, 1, 0.1); }
      .ticker { position: fixed; top: 0; width: 100%; background: #000; color: var(--gold); font-size: 0.7rem; padding: 10px; text-align: center; border-bottom: 1px solid var(--gold); font-family: 'JetBrains Mono'; }
  </style>
</head>
<body>
<div class="ticker">THE HOLY GHOST: SUPREME ARCHITECT | ARCHITECT: EDGAR WAMEYO | LSSBB CERTIFIED</div>
<canvas id="bg-canvas"></canvas>
<div class="terminal-frame">
    <h1 style="text-align:center; margin-bottom: 20px;">COMMAND CENTER</h1>
    <a href="industrial-node.html" class="node"><span>ASSET NODE</span><span>▶</span></a>
    <a href="fintech.html" class="node"><span>FINTECH NODE</span><span>▶</span></a>
    <a href="services-node.html" class="node"><span>SERVICE NODE</span><span>▶</span></a>
    <div class="node" onclick="unlock()"><span>MANUFACTURING HUB</span><span>🔒</span></div>
</div>
<script>
    async function unlock() {
        const p = prompt("AUTHORIZATION REQUIRED (7742):");
        if(!p) return;
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(p));
        const hash = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        // HASH FOR 7742
        if(hash === "6f0b4352b95b8637736f9477087612f00889270562e8477033734e565987309a") {
            window.location.href = "NexusPro.html";
        } else { alert("ACCESS DENIED"); }
    }
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const drops = Array(Math.floor(canvas.width/14)).fill(1);
    function draw() {
        ctx.fillStyle = "rgba(2, 6, 23, 0.15)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fcc201"; drops.forEach((y, i) => {
            ctx.fillText(Math.floor(Math.random()*2), i*14, y*14);
            if (y*14 > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }
    setInterval(draw, 50);
</script>
</body>
</html>
