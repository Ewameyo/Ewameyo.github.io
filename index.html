<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Edgar Wameyo | LSSBB Operational Excellence Dashboard</title>
    <meta name="description" content="Official Strategic Command Center of Edgar Wameyo. High-fidelity Operational Excellence and Fintech performance tracking.">
    <meta name="keywords" content="Edgar Wameyo, LSSBB, Lean Six Sigma Black Belt, Operational Excellence, Fintech, Nairobi">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a; --accent: #f0b429; --success: #22c55e;
            --warning: #f59e0b; --danger: #ef4444; --text: #f8fafc;
        }
        body { 
            font-family: 'Rajdhani', sans-serif; margin: 0; background: #020617; color: var(--text);
            overflow-x: hidden; width: 100vw; min-height: 100vh;
        }

        /* Header Section */
        .header { 
            background: linear-gradient(90deg, #0f172a 0%, #1e293b 100%);
            padding: 20px 40px; border-bottom: 3px solid var(--accent);
            display: flex; justify-content: space-between; align-items: center;
        }
        .identity h1 { font-family: 'Orbitron', sans-serif; margin: 0; letter-spacing: 2px; font-size: 28px; color: #fff; }
        .identity p { color: var(--accent); margin: 5px 0 0; font-weight: bold; letter-spacing: 1.2px; text-transform: uppercase; font-size: 14px; }

        /* Status Block */
        .status-block { display: flex; align-items: center; gap: 20px; }
        #clock { font-family: 'Orbitron', sans-serif; font-size: 22px; color: var(--accent); min-width: 120px; text-align: right; }

        /* Navigation */
        .nav-tabs { display: flex; background: #000; padding: 10px 40px 0; gap: 5px; }
        .nav-link { 
            padding: 12px 25px; background: #1e293b; color: white; text-decoration: none; 
            border-radius: 5px 5px 0 0; font-weight: bold; font-size: 13px;
        }
        .nav-link.active { background: var(--accent); color: #000; }

        /* KPI Grid */
        .container { 
            display: grid; grid-template-columns: repeat(3, 1fr); 
            gap: 20px; padding: 30px 40px; box-sizing: border-box;
        }
        .card { 
            background: #0f172a; border-radius: 4px; padding: 25px; 
            border: 1px solid #1e293b; border-left: 5px solid var(--accent);
        }
        .label { color: #94a3b8; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; }
        .value { font-family: 'Orbitron', sans-serif; font-size: 40px; display: block; margin: 15px 0; color: #fff; }
        .status-pill { display: inline-flex; align-items: center; padding: 5px 12px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .pill-green { background: rgba(34, 197, 94, 0.2); color: var(--success); }

        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="header">
    <div class="identity">
        <h1>EDGAR WAMEYO</h1>
        <p>LSSBB | OPERATIONAL EXCELLENCE LEADER</p>
    </div>
    <div class="status-block">
        <div id="clock">00:00:00</div>
    </div>
</div>

<nav class="nav-tabs">
    <a href="index.html" class="nav-link active">MAIN COMMAND</a>
    <a href="fintech.html" class="nav-link">FINTECH OPERATIONS</a>
</nav>

<div class="container">
    <div class="card">
        <span class="label">Strategic Financial Throughput</span>
        <span class="value">$2.14M</span>
        <div class="status-pill pill-green">ROI TARGET REACHED</div>
    </div>
    <div class="card">
        <span class="label">Process Capability (Cpk)</span>
        <span class="value">1.67</span>
        <div class="status-pill pill-green">STABLE PROCESS</div>
    </div>
    <div class="card">
        <span class="label">System Yield (RTY)</span>
        <span class="value">99.1%</span>
        <div class="status-pill pill-green">WORLD CLASS</div>
    </div>
</div>

<script>
    function updateClock() {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();
</script>

</body>
</html>
