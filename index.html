<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EDGAR WAMEYO | LEAD SYSTEMS ARCHITECT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@500;800&display=swap');
        :root { --gold: #fcc201; --bg: #020617; --green: #22c55e; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg); display: flex; justify-content: center; align-items: center; }
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; }
        .terminal-frame { width: 95%; max-width: 550px; background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(252, 194, 1, 0.4); border-radius: 20px; padding: 35px; box-shadow: 0 0 80px rgba(0,0,0,1); backdrop-filter: blur(15px); z-index: 10; }
        .header-status { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.6); padding: 15px 20px; border-bottom: 2px solid var(--gold); border-radius: 12px; margin-bottom: 25px; }
        #clock { font-size: 1.6rem; font-weight: 800; color: #fff; text-shadow: 0 0 15px var(--gold); }
        .name-header { font-family: 'Orbitron'; font-size: 2.2rem; color: #ffffff; text-shadow: 0 0 20px rgba(255, 255, 255, 0.4); letter-spacing: 2px; text-align: center; }
        .node { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); padding: 18px; border-radius: 12px; text-decoration: none; color: white; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; transition: 0.3s; }
        .node:hover { border-color: var(--gold); background: rgba(252, 194, 1, 0.1); transform: translateX(5px); }
        .signature-footer { position: fixed; bottom: 0; width: 100%; background: var(--gold); color: #000; padding: 15px 0; text-align: center; font-family: 'Orbitron'; font-weight: 900; font-size: 0.85rem; z-index: 1000; }
    </style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="terminal-frame">
    <div class="header-status">
        <div style="font-family:'Orbitron'; font-size: 0.8rem; color: var(--green);">● SYSTEM: ACTIVE</div>
        <div id="clock">00:00:00</div>
    </div>
    <h1 class="name-header">EDGAR WAMEYO</h1>
    <p style="color:var(--gold); text-align:center; font-weight:700; margin-bottom: 25px;">LEAD SYSTEMS ARCHITECT | LSSBB</p>
    <div class="node-list">
        <a href="industrial-node.html" class="node"><div><b>ASSET NODE</b><br><small>Predictive Analytics</small></div><span>▶</span></a>
        <a href="fintech.html" class="node"><div><b>FINTECH NODE</b><br><small>Velocity Governance</small></div><span>▶</span></a>
        <a href="services-node.html" class="node"><div><b>SERVICE NODE</b><br><small>360° Operational Governance</small></div><span>▶</span></a>
        <div class="node" onclick="unlock()" style="cursor:pointer;"><div><b>MANUFACTURING HUB</b><br><small>Secured Node (v2.0)</small></div><span id="lock-icon">🔒</span></div>
    </div>
</div>
<div class="signature-footer">ENGINEERED BY EDGAR WAMEYO, LSSBB | BY GOD'S GRACE</div>
<script>
    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
    function unlock() { let pin = prompt("ENTER PIN:"); if(btoa(pin) === "NTU5MQ==") { window.location.href = "NexusPro.html"; } }
    const canvas = document.getElementById('bg-canvas'); const ctx = canvas.getContext('2d');
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();
    const characters = "01"; const fontSize = 14; const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);
    function draw() {
        ctx.fillStyle = "rgba(2, 6, 23, 0.15)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fcc201"; ctx.font = fontSize + "px monospace";
        for (let i = 0; i < drops.length; i++) {
            const text = characters.charAt(Math.floor(Math.random() * characters.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(draw, 50);
</script>
</body>
</html>
